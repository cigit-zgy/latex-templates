name: Probe Windows fonts

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/probe-windows-fonts.yml"

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Probe required fonts
        shell: pwsh
        run: |
          $required = @("times.ttf", "timesbd.ttf", "timesi.ttf", "timesbi.ttf", "simsun.ttc", "simsunb.ttf", "simkai.ttf", "simfang.ttf")
          foreach ($name in $required) {
            $path = Join-Path $env:WINDIR "Fonts\$name"
            Write-Host "$name`t$(Test-Path $path)`t$path"
          }
