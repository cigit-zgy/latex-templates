name: Render template previews

on:
  push:
    branches: [master]
    paths-ignore:
      - "thesis/classic-academic/preview/**"
      - "report/classic-academic/preview/**"
      - "report/short-charter/preview/**"
      - "cv/curve-academic/preview/**"
      - "journal/nature/preview/**"
      - "journal/elsevier/preview/**"
      - "journal/acs/preview/**"
      - "journal/chinese/preview/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-template-previews
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage pinned journal source files
        run: bash scripts/sync-journal-sources.sh

      - name: Validate shared document style contract
        run: python3 scripts/validate-style-contract.py

      - name: Install TeX and render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-fonts-extra-links \
            texlive-lang-chinese texlive-bibtex-extra \
            texlive-science texlive-publishers \
            biber latexmk poppler-utils woff2 curl
          sudo mktexlsr
          kpsewhich newtxtext.sty
          kpsewhich newtxmath.sty

      - name: Build thesis sample
        working-directory: thesis/classic-academic
        run: |
          ./scripts/setup-fonts.sh
          ./scripts/build.sh
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 200 main.pdf preview/title
          pages=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
          hierarchy_page=""
          for p in $(seq 1 "$pages"); do
            if pdftotext -f "$p" -l "$p" main.pdf - 2>/dev/null | grep -Fqi "Research Background"; then
              hierarchy_page="$p"
              break
            fi
          done
          test -n "$hierarchy_page"
          pdftoppm -f "$hierarchy_page" -singlefile -png -r 200 main.pdf preview/hierarchy

      - name: Build classic report sample
        working-directory: report/classic-academic
        run: |
          ./scripts/setup-fonts.sh
          ./scripts/build.sh
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 200 main.pdf preview/title
          pages=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
          hierarchy_page=""
          for p in $(seq 1 "$pages"); do
            if pdftotext -f "$p" -l "$p" main.pdf - 2>/dev/null | grep -Fqi "Analysis and Results"; then
              hierarchy_page="$p"
              break
            fi
          done
          test -n "$hierarchy_page"
          pdftoppm -f "$hierarchy_page" -singlefile -png -r 200 main.pdf preview/hierarchy

      - name: Build short report sample
        working-directory: report/short-charter
        run: |
          ./scripts/build.sh
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 200 main.pdf preview/title
          pages=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
          hierarchy_page=""
          for p in $(seq 1 "$pages"); do
            if pdftotext -f "$p" -l "$p" main.pdf - 2>/dev/null | grep -Fqi "Methods"; then
              hierarchy_page="$p"
              break
            fi
          done
          test -n "$hierarchy_page"
          pdftoppm -f "$hierarchy_page" -singlefile -png -r 200 main.pdf preview/hierarchy

      - name: Build academic CurVe CV sample
        working-directory: cv/curve-academic
        run: |
          ./scripts/build.sh
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 200 main.pdf preview/cv

      - name: Build Springer Nature sample
        working-directory: journal/nature
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          mkdir -p preview
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 200 main.pdf preview/article

      - name: Build Elsevier sample
        working-directory: journal/elsevier
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          mkdir -p preview
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 200 main.pdf preview/article

      - name: Build ACS sample
        working-directory: journal/acs
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          mkdir -p preview
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 200 main.pdf preview/article

      - name: Build Chinese journal sample
        working-directory: journal/chinese
        run: |
          bash scripts/setup-fonts.sh
          if ! latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex; then
            echo "--- Chinese journal LaTeX error context ---"
            grep -n -B 4 -A 12 '^!' main.log || tail -n 120 main.log
            exit 1
          fi
          mkdir -p preview
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 200 main.pdf preview/article

      - name: Verify journal preview files
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          paths = [
              Path("journal/nature/preview/article.png"),
              Path("journal/elsevier/preview/article.png"),
              Path("journal/acs/preview/article.png"),
              Path("journal/chinese/preview/article.png"),
          ]
          for path in paths:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing journal preview: {path}")
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"not a PNG: {path}")
              width, height = struct.unpack(">II", data[16:24])
              if width < 1000 or height < 1000:
                  raise SystemExit(f"unexpected journal preview size {width}x{height}: {path}")
              print(f"verified {path}: {width}x{height}")
          PY

      - name: Verify existing preview dimensions
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          expected = {
              Path("thesis/classic-academic/preview/title.png"): (1700, 2200),
              Path("thesis/classic-academic/preview/hierarchy.png"): (1700, 2200),
              Path("report/classic-academic/preview/title.png"): (1700, 2200),
              Path("report/classic-academic/preview/hierarchy.png"): (1700, 2200),
              Path("report/short-charter/preview/title.png"): (1654, 2339),
              Path("report/short-charter/preview/hierarchy.png"): (1654, 2339),
              Path("cv/curve-academic/preview/cv.png"): (1654, 2339),
          }
          for path, target in expected.items():
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"not a PNG: {path}")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != target:
                  raise SystemExit(f"unexpected preview size {width}x{height}: {path}")
              print(f"verified {path}: {width}x{height}")
          PY

      - name: Refresh README preview cache keys
        run: python3 scripts/update-preview-revisions.py

      - name: Commit source and renderer output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            README.md \
            thesis/classic-academic/README.md thesis/classic-academic/preview \
            report/classic-academic/README.md report/classic-academic/preview \
            report/short-charter/README.md report/short-charter/preview \
            cv/curve-academic/README.md cv/curve-academic/preview \
            journal
          if git diff --cached --quiet; then
            echo "Template sources, previews, and cache keys are current."
            exit 0
          fi
          git commit -m "chore: synchronize journal sources and previews [skip ci]"
          git push
