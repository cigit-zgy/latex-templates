name: Render template previews

on:
  push:
    branches: [master]
    paths-ignore:
      - "thesis/classic-academic/preview/**"
      - "report/classic-academic/preview/**"
      - "report/short-charter/preview/**"
      - "cv/curve-academic/preview/**"
      - "journal/nature/preview/**"
      - "journal/elsevier/preview/**"
      - "journal/acs/preview/**"
      - "journal/kxtbcas/preview/**"
      - "nsfc-general/preview/**"
      - "nsfc-young/preview/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-template-previews
  cancel-in-progress: true

jobs:
  exact-font-previews:
    runs-on: windows-latest
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install Simplified Chinese Windows fonts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $capability = Get-WindowsCapability -Online | Where-Object { $_.Name -like "Language.Fonts.Hans*" } | Select-Object -First 1
          if (-not $capability) {
            throw "Simplified Chinese supplemental font capability was not found."
          }
          if ($capability.State -ne "Installed") {
            Add-WindowsCapability -Online -Name $capability.Name | Out-Host
          }
          $required = @("times.ttf", "timesbd.ttf", "timesi.ttf", "timesbi.ttf", "simsun.ttc", "simsunb.ttf", "simkai.ttf", "simfang.ttf")
          foreach ($name in $required) {
            $path = Join-Path $env:WINDIR "Fonts\$name"
            if (-not (Test-Path $path)) {
              throw "Required Windows font is missing after capability installation: $path"
            }
          }

      - name: Install MiKTeX, Poppler, and fontTools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install miktex --no-progress --params "/Set:basic" -y
          choco install poppler --no-progress -y
          python -m pip install --disable-pip-version-check fonttools
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          $miktexBin = "C:\Program Files\MiKTeX\miktex\bin\x64"
          if (-not (Test-Path $miktexBin)) {
            throw "MiKTeX executable directory is missing: $miktexBin"
          }
          $env:Path = "$miktexBin;$env:Path"
          $miktexBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          miktex --admin packages update-package-database
          initexmf --admin '--set-config-value=[MPM]AutoInstall=1'
          initexmf --admin --update-fndb
          xelatex --version
          bibtex --version
          pdftoppm -v

      - name: Compile KXTB-CAS from repository source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\journal\kxtbcas\scripts\build.ps1
          if (-not (Test-Path .\journal\kxtbcas\main.pdf)) {
            throw "KXTB-CAS repository source did not produce main.pdf"
          }
          $fontReport = (& pdffonts .\journal\kxtbcas\main.pdf) -join "`n"
          Write-Host $fontReport
          if ($fontReport -notmatch "TimesNewRoman|Times New Roman") {
            throw "KXTB-CAS PDF does not contain Times New Roman."
          }
          if ($fontReport -notmatch "SimSun") {
            throw "KXTB-CAS PDF does not contain SimSun."
          }
          New-Item -ItemType Directory -Force .\journal\kxtbcas\preview | Out-Null
          Remove-Item .\journal\kxtbcas\preview\*.png -ErrorAction SilentlyContinue
          pdftoppm -f 1 -singlefile -png -r 100 .\journal\kxtbcas\main.pdf .\journal\kxtbcas\preview\article
          pdftoppm -f 2 -singlefile -png -r 100 .\journal\kxtbcas\main.pdf .\journal\kxtbcas\preview\content

      - name: Compile NSFC General from repository source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\nsfc-general\scripts\build.ps1
          if (-not (Test-Path .\nsfc-general\main.pdf)) {
            throw "NSFC General repository source did not produce main.pdf"
          }
          $fontReport = (& pdffonts .\nsfc-general\main.pdf) -join "`n"
          Write-Host $fontReport
          if ($fontReport -notmatch "SimSun") {
            throw "NSFC General PDF does not contain SimSun."
          }
          New-Item -ItemType Directory -Force .\nsfc-general\preview | Out-Null
          Remove-Item .\nsfc-general\preview\*.png -ErrorAction SilentlyContinue
          pdftoppm -f 1 -singlefile -png -r 100 .\nsfc-general\main.pdf .\nsfc-general\preview\application
          pdftoppm -f 2 -singlefile -png -r 100 .\nsfc-general\main.pdf .\nsfc-general\preview\content

      - name: Compile NSFC Young from repository source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\nsfc-young\scripts\build.ps1
          if (-not (Test-Path .\nsfc-young\main.pdf)) {
            throw "NSFC Young repository source did not produce main.pdf"
          }
          $fontReport = (& pdffonts .\nsfc-young\main.pdf) -join "`n"
          Write-Host $fontReport
          if ($fontReport -notmatch "SimSun") {
            throw "NSFC Young PDF does not contain SimSun."
          }
          New-Item -ItemType Directory -Force .\nsfc-young\preview | Out-Null
          Remove-Item .\nsfc-young\preview\*.png -ErrorAction SilentlyContinue
          pdftoppm -f 1 -singlefile -png -r 100 .\nsfc-young\main.pdf .\nsfc-young\preview\application
          pdftoppm -f 2 -singlefile -png -r 100 .\nsfc-young\main.pdf .\nsfc-young\preview\content

      - name: Verify exact-font preview dimensions
        shell: pwsh
        run: |
          @'
          import struct
          from pathlib import Path

          paths = [
              Path("journal/kxtbcas/preview/article.png"),
              Path("journal/kxtbcas/preview/content.png"),
              Path("nsfc-general/preview/application.png"),
              Path("nsfc-general/preview/content.png"),
              Path("nsfc-young/preview/application.png"),
              Path("nsfc-young/preview/content.png"),
          ]
          for path in paths:
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"not a PNG: {path}")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) not in {(827, 1169), (827, 1170)}:
                  raise SystemExit(f"unexpected 100-DPI A4 preview size {width}x{height}: {path}")
              print(f"verified {path}: {width}x{height}")
          '@ | python -

      - name: Commit exact-font previews
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/kxtbcas/preview nsfc-general/preview nsfc-young/preview
          if (git diff --cached --quiet) {
            Write-Host "Exact-font previews are current."
          } else {
            git commit -m "chore: render exact-font 100 dpi previews [skip ci]"
            git push origin master
          }

  render-open-templates:
    needs: exact-font-previews
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest repository state
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Stage pinned journal source files
        run: bash scripts/sync-journal-sources.sh

      - name: Validate shared document style contract
        run: python3 scripts/validate-style-contract.py

      - name: Install TeX and render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-fonts-extra-links \
            texlive-lang-chinese texlive-bibtex-extra \
            texlive-science texlive-publishers \
            biber latexmk poppler-utils woff2 curl
          sudo mktexlsr

      - name: Build thesis sample
        working-directory: thesis/classic-academic
        run: |
          ./scripts/build.sh
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/title
          pages=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
          hierarchy_page=""
          for p in $(seq 1 "$pages"); do
            if pdftotext -f "$p" -l "$p" main.pdf - 2>/dev/null | grep -Fqi "Research Background"; then
              hierarchy_page="$p"
              break
            fi
          done
          test -n "$hierarchy_page"
          pdftoppm -f "$hierarchy_page" -singlefile -png -r 100 main.pdf preview/hierarchy

      - name: Build classic report sample
        working-directory: report/classic-academic
        run: |
          ./scripts/build.sh
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/title
          pages=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
          hierarchy_page=""
          for p in $(seq 1 "$pages"); do
            if pdftotext -f "$p" -l "$p" main.pdf - 2>/dev/null | grep -Fqi "Analysis and Results"; then
              hierarchy_page="$p"
              break
            fi
          done
          test -n "$hierarchy_page"
          pdftoppm -f "$hierarchy_page" -singlefile -png -r 100 main.pdf preview/hierarchy

      - name: Build short report sample
        working-directory: report/short-charter
        run: |
          ./scripts/build.sh
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/title
          pages=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
          hierarchy_page=""
          for p in $(seq 1 "$pages"); do
            if pdftotext -f "$p" -l "$p" main.pdf - 2>/dev/null | grep -Fqi "Methods"; then
              hierarchy_page="$p"
              break
            fi
          done
          test -n "$hierarchy_page"
          pdftoppm -f "$hierarchy_page" -singlefile -png -r 100 main.pdf preview/hierarchy

      - name: Build academic CurVe CV sample
        working-directory: cv/curve-academic
        run: |
          ./scripts/build.sh
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/cv

      - name: Build Springer Nature sample
        working-directory: journal/nature
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          mkdir -p preview
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/article

      - name: Build Elsevier sample
        working-directory: journal/elsevier
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          mkdir -p preview
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/article

      - name: Build ACS sample
        working-directory: journal/acs
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          mkdir -p preview
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/article

      - name: Verify complete preview coverage
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          expected = {
              Path("thesis/classic-academic/preview/title.png"): {(850, 1100)},
              Path("thesis/classic-academic/preview/hierarchy.png"): {(850, 1100)},
              Path("report/classic-academic/preview/title.png"): {(850, 1100)},
              Path("report/classic-academic/preview/hierarchy.png"): {(850, 1100)},
              Path("report/short-charter/preview/title.png"): {(827, 1170)},
              Path("report/short-charter/preview/hierarchy.png"): {(827, 1170)},
              Path("cv/curve-academic/preview/cv.png"): {(827, 1170)},
              Path("journal/kxtbcas/preview/article.png"): {(827, 1169), (827, 1170)},
              Path("journal/kxtbcas/preview/content.png"): {(827, 1169), (827, 1170)},
              Path("nsfc-general/preview/application.png"): {(827, 1169), (827, 1170)},
              Path("nsfc-general/preview/content.png"): {(827, 1169), (827, 1170)},
              Path("nsfc-young/preview/application.png"): {(827, 1169), (827, 1170)},
              Path("nsfc-young/preview/content.png"): {(827, 1169), (827, 1170)},
          }
          minimum = [
              Path("journal/nature/preview/article.png"),
              Path("journal/elsevier/preview/article.png"),
              Path("journal/acs/preview/article.png"),
          ]
          for path, targets in expected.items():
              if not path.is_file():
                  raise SystemExit(f"missing preview: {path}")
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"not a PNG: {path}")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) not in targets:
                  raise SystemExit(f"unexpected preview size {width}x{height}: {path}")
              print(f"verified {path}: {width}x{height}")
          for path in minimum:
              data = path.read_bytes()
              width, height = struct.unpack(">II", data[16:24])
              if width < 500 or height < 500:
                  raise SystemExit(f"unexpected journal preview size {width}x{height}: {path}")
              print(f"verified {path}: {width}x{height}")
          PY

      - name: Refresh README preview cache keys
        run: python3 scripts/update-preview-revisions.py

      - name: Commit renderer output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            README.md \
            thesis/classic-academic/README.md thesis/classic-academic/preview \
            report/classic-academic/README.md report/classic-academic/preview \
            report/short-charter/README.md report/short-charter/preview \
            cv/curve-academic/README.md cv/curve-academic/preview \
            journal/nature journal/elsevier journal/acs journal/kxtbcas/README.md \
            nsfc-general/README.md nsfc-young/README.md
          if git diff --cached --quiet; then
            echo "Template previews and cache keys are current."
            exit 0
          fi
          git commit -m "chore: refresh 100 dpi previews [skip ci]"
          git push origin master
