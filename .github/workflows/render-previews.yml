name: Render template previews

on:
  push:
    branches: [master]
    paths-ignore:
      - "thesis/classic-academic/preview/**"
      - "report/classic-academic/preview/**"
      - "report/short-charter/preview/**"
      - "cv/curve-academic/preview/**"
      - "journal/nature/preview/**"
      - "journal/elsevier/preview/**"
      - "journal/acs/preview/**"
      - "journal/kxtbcas/preview/**"
      - "nsfc-general/preview/**"
      - "nsfc-young/preview/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-template-previews
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage pinned journal source files
        run: bash scripts/sync-journal-sources.sh

      - name: Validate shared document style contract
        run: python3 scripts/validate-style-contract.py

      - name: Install TeX and render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-fonts-extra-links \
            texlive-lang-chinese texlive-bibtex-extra \
            texlive-science texlive-publishers \
            biber latexmk poppler-utils woff2 curl
          sudo mktexlsr
          kpsewhich newtxtext.sty
          kpsewhich newtxmath.sty
          kpsewhich FandolSong-Regular.otf
          kpsewhich FandolSong-Bold.otf
          kpsewhich FandolKai-Regular.otf
          kpsewhich FandolFang-Regular.otf
          kpsewhich lmroman10-regular.otf
          kpsewhich lmroman10-bold.otf
          kpsewhich lmsans10-regular.otf
          kpsewhich lmsans10-bold.otf

      - name: Build thesis sample
        working-directory: thesis/classic-academic
        run: |
          ./scripts/build.sh
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/title
          pages=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
          hierarchy_page=""
          for p in $(seq 1 "$pages"); do
            if pdftotext -f "$p" -l "$p" main.pdf - 2>/dev/null | grep -Fqi "Research Background"; then
              hierarchy_page="$p"
              break
            fi
          done
          test -n "$hierarchy_page"
          pdftoppm -f "$hierarchy_page" -singlefile -png -r 100 main.pdf preview/hierarchy

      - name: Build classic report sample
        working-directory: report/classic-academic
        run: |
          ./scripts/build.sh
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/title
          pages=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
          hierarchy_page=""
          for p in $(seq 1 "$pages"); do
            if pdftotext -f "$p" -l "$p" main.pdf - 2>/dev/null | grep -Fqi "Analysis and Results"; then
              hierarchy_page="$p"
              break
            fi
          done
          test -n "$hierarchy_page"
          pdftoppm -f "$hierarchy_page" -singlefile -png -r 100 main.pdf preview/hierarchy

      - name: Build short report sample
        working-directory: report/short-charter
        run: |
          ./scripts/build.sh
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/title
          pages=$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')
          hierarchy_page=""
          for p in $(seq 1 "$pages"); do
            if pdftotext -f "$p" -l "$p" main.pdf - 2>/dev/null | grep -Fqi "Methods"; then
              hierarchy_page="$p"
              break
            fi
          done
          test -n "$hierarchy_page"
          pdftoppm -f "$hierarchy_page" -singlefile -png -r 100 main.pdf preview/hierarchy

      - name: Build academic CurVe CV sample
        working-directory: cv/curve-academic
        run: |
          ./scripts/build.sh
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/cv

      - name: Build Springer Nature sample
        working-directory: journal/nature
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          mkdir -p preview
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/article

      - name: Build Elsevier sample
        working-directory: journal/elsevier
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          mkdir -p preview
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/article

      - name: Build ACS sample
        working-directory: journal/acs
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          mkdir -p preview
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/article

      - name: Validate KXTB-CAS exact font contract
        working-directory: journal/kxtbcas
        run: |
          test -x scripts/setup-fonts.sh
          test -x scripts/build.sh
          grep -Fq './fonts/' kxtbcas.cls
          grep -Fq 'TimesNewRoman-Regular.ttf' kxtbcas.cls
          grep -Fq 'TimesNewRoman-Bold.ttf' kxtbcas.cls
          grep -Fq 'TimesNewRoman-Italic.ttf' kxtbcas.cls
          grep -Fq 'TimesNewRoman-BoldItalic.ttf' kxtbcas.cls
          grep -Fq 'SimSun.ttf' kxtbcas.cls
          grep -Fq 'SimSun-Bold.ttf' kxtbcas.cls
          grep -Fq '\setsansfont[' kxtbcas.cls
          grep -Fq '\setCJKsansfont[' kxtbcas.cls
          if grep -Eq 'FandolSong|FandolHei|TeX Gyre Termes|Songti SC|STSong|Heiti SC|STHeiti' kxtbcas.cls; then
            echo 'KXTB-CAS contains a forbidden fallback font.' >&2
            exit 1
          fi

      - name: Render exact-font KXTB-CAS reference preview
        run: |
          mkdir -p journal/kxtbcas/preview
          rm -f journal/kxtbcas/preview/*.png
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/cigit-zgy/structure-object-perspective/7acb43750182ec1ffe5e992d2fc7c9d625a5a118/00_archive/260819/main.pdf \
            --output /tmp/kxtbcas-reference.pdf
          test "$(pdfinfo /tmp/kxtbcas-reference.pdf | awk '/^Pages:/ {print $2}')" -ge 2
          pdftoppm -f 1 -singlefile -png -r 100 /tmp/kxtbcas-reference.pdf journal/kxtbcas/preview/article
          pdftoppm -f 2 -singlefile -png -r 100 /tmp/kxtbcas-reference.pdf journal/kxtbcas/preview/content

      - name: Render NSFC reference previews
        run: |
          mkdir -p nsfc-general/preview nsfc-young/preview
          rm -f nsfc-general/preview/*.png nsfc-young/preview/*.png
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/andy123t/nsfc-latex/11a02726f6190fcb89859dfaed18e3d1d68af0b8/main-GP.pdf \
            --output /tmp/nsfc-general-reference.pdf
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/andy123t/nsfc-latex/11a02726f6190fcb89859dfaed18e3d1d68af0b8/main-YF.pdf \
            --output /tmp/nsfc-young-reference.pdf
          test "$(pdfinfo /tmp/nsfc-general-reference.pdf | awk '/^Pages:/ {print $2}')" -ge 2
          test "$(pdfinfo /tmp/nsfc-young-reference.pdf | awk '/^Pages:/ {print $2}')" -ge 2
          pdftoppm -f 1 -singlefile -png -r 100 /tmp/nsfc-general-reference.pdf nsfc-general/preview/application
          pdftoppm -f 2 -singlefile -png -r 100 /tmp/nsfc-general-reference.pdf nsfc-general/preview/content
          pdftoppm -f 1 -singlefile -png -r 100 /tmp/nsfc-young-reference.pdf nsfc-young/preview/application
          pdftoppm -f 2 -singlefile -png -r 100 /tmp/nsfc-young-reference.pdf nsfc-young/preview/content

      - name: Verify preview files
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          minimum = [
              Path("journal/nature/preview/article.png"),
              Path("journal/elsevier/preview/article.png"),
              Path("journal/acs/preview/article.png"),
              Path("journal/kxtbcas/preview/article.png"),
              Path("journal/kxtbcas/preview/content.png"),
              Path("nsfc-general/preview/application.png"),
              Path("nsfc-general/preview/content.png"),
              Path("nsfc-young/preview/application.png"),
              Path("nsfc-young/preview/content.png"),
          ]
          for path in minimum:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing preview: {path}")
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"not a PNG: {path}")
              width, height = struct.unpack(">II", data[16:24])
              if width < 500 or height < 500:
                  raise SystemExit(f"unexpected preview size {width}x{height}: {path}")
              print(f"verified {path}: {width}x{height}")
          PY

      - name: Verify existing preview dimensions
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          expected = {
              Path("thesis/classic-academic/preview/title.png"): (850, 1100),
              Path("thesis/classic-academic/preview/hierarchy.png"): (850, 1100),
              Path("report/classic-academic/preview/title.png"): (850, 1100),
              Path("report/classic-academic/preview/hierarchy.png"): (850, 1100),
              Path("report/short-charter/preview/title.png"): (827, 1170),
              Path("report/short-charter/preview/hierarchy.png"): (827, 1170),
              Path("cv/curve-academic/preview/cv.png"): (827, 1170),
          }
          for path, target in expected.items():
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"not a PNG: {path}")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != target:
                  raise SystemExit(f"unexpected preview size {width}x{height}: {path}")
              print(f"verified {path}: {width}x{height}")
          PY

      - name: Refresh README preview cache keys
        run: python3 scripts/update-preview-revisions.py

      - name: Commit renderer output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            README.md \
            thesis/classic-academic/README.md thesis/classic-academic/preview \
            report/classic-academic/README.md report/classic-academic/preview \
            report/short-charter/README.md report/short-charter/preview \
            cv/curve-academic/README.md cv/curve-academic/preview \
            journal/nature journal/elsevier journal/acs journal/kxtbcas \
            nsfc-general nsfc-young
          if git diff --cached --quiet; then
            echo "Template previews and cache keys are current."
            exit 0
          fi
          git commit -m "chore: refresh 100 dpi previews [skip ci]"
          git push
