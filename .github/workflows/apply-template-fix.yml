name: Apply template migration

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/apply-template-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply template and preview migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cls_path = Path("journal/chinese/kxtbcas.cls")
          cls = cls_path.read_text()
          old = """\\def\\kxtb@cjkfallback@main{Songti SC}
          \\def\\kxtb@cjkfallback@mainalt{STSong}
          \\def\\kxtb@cjkfallback@sans{Heiti SC}
          \\def\\kxtb@cjkfallback@sansalt{STHeiti}""".replace("          ", "")
          new = """\\def\\kxtb@cjkfallback@main{Songti SC}
          \\def\\kxtb@cjkfallback@mainalt{FandolSong}
          \\def\\kxtb@cjkfallback@sans{Songti SC}
          \\def\\kxtb@cjkfallback@sansalt{FandolSong}""".replace("          ", "")
          if old not in cls:
              raise SystemExit("expected Chinese font fallback block not found")
          cls = cls.replace(old, new, 1)
          if "Heiti" in cls or "FandolHei" in cls:
              raise SystemExit("non-serif Chinese font role remains in kxtbcas.cls")
          cls_path.write_text(cls)

          sync_path = Path("scripts/sync-journal-sources.sh")
          sync = sync_path.read_text()
          line = 'sync_file "chinese/kxtbcas.cls" "journal/chinese/kxtbcas.cls" "e3f0119fffa25386b75329775e7049f9dadc47ff"\n'
          if line not in sync:
              raise SystemExit("expected Chinese class sync line not found")
          sync_path.write_text(sync.replace(line, "", 1))

          workflow_path = Path(".github/workflows/render-previews.yml")
          workflow = workflow_path.read_text()
          workflow = workflow.replace("          kpsewhich FandolHei-Regular.otf\n", "")
          workflow = workflow.replace("          kpsewhich FandolHei-Bold.otf\n", "")
          workflow = workflow.replace("-r 200", "-r 100")
          workflow = workflow.replace("width < 1000 or height < 1000", "width < 500 or height < 500")
          workflow = workflow.replace("(1700, 2200)", "(850, 1100)")
          workflow = workflow.replace("(1654, 2339)", "(827, 1170)")
          if "-r 200" in workflow or "FandolHei" in workflow:
              raise SystemExit("old preview DPI or non-serif Chinese dependency remains")
          workflow_path.write_text(workflow)

          for path in Path(".").rglob("*.md"):
              text = path.read_text(errors="strict")
              updated = text.replace("200-dpi", "100-dpi").replace("200 DPI", "100 DPI").replace("-r 200", "-r 100")
              if updated != text:
                  path.write_text(updated)

          readme_path = Path("journal/chinese/README.md")
          readme = readme_path.read_text()
          readme = readme.replace(
              "Standalone XeLaTeX Chinese scientific manuscript using the pinned project-maintained `kxtbcas.cls` and `kxtbcas-numeric.bst` resources from `cigit-zgy/sci-manuscript-skill`.",
              "Standalone XeLaTeX Chinese scientific manuscript using the project-maintained `kxtbcas.cls` and `kxtbcas-numeric.bst` resources."
          )
          readme = readme.replace(
              "- `kxtbcas.cls` — pinned manuscript class; kept unchanged from the source repository.",
              "- `kxtbcas.cls` — authoritative manuscript class for typography and layout."
          )
          readme = readme.replace(
              "The source class defines Times New Roman and SimSun as its local-file defaults, with its own system-font fallback chain. The article title is centered by the source class inside `\\kxtb@frontmatter`; the standalone template does not duplicate or alter that rule.",
              "The class keeps the original Times/SimSun serif roles and resolves portable fallbacks to TeX Gyre Termes and Song-style serif Chinese families. Both body and display-family roles are serif. The article title remains centered inside `\\kxtb@frontmatter`; its size, weight, spacing, and alignment are unchanged."
          )
          readme = readme.replace(
              "The source class requires XeLaTeX and suitable fonts in the build environment. Font availability is an environment requirement and is not compensated for by changing the template typography.",
              "The class requires XeLaTeX. Portable fallback fonts preserve the same serif typography without introducing a sans-serif Chinese display family."
          )
          readme_path.write_text(readme)
          PY

          rm .github/workflows/apply-template-fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce serif Chinese template and 100 dpi previews"
          git push
