name: Migrate KXTB-CAS template

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/migrate-kxtbcas.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: |
          python3 scripts/migrate-kxtbcas-temp.py
          chmod +x journal/kxtbcas/scripts/setup-fonts.sh journal/kxtbcas/scripts/build.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/migrate-kxtbcas.yml'
          git commit -m "refactor: isolate KXTB-CAS template fonts"
          git push
