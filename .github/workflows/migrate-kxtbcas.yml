name: Migrate KXTB-CAS template

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/migrate-kxtbcas.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply isolated template migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          old_dir = root / "journal" / "chinese"
          new_dir = root / "journal" / "kxtbcas"
          if old_dir.exists():
              if new_dir.exists():
                  raise SystemExit("both journal/chinese and journal/kxtbcas exist")
              old_dir.rename(new_dir)
          if not new_dir.is_dir():
              raise SystemExit("journal/kxtbcas is missing")

          cls_path = new_dir / "kxtbcas.cls"
          cls = cls_path.read_text(encoding="utf-8")
          cls = cls.replace(r"\def\kxtb@latinfontpath{./}", r"\def\kxtb@latinfontpath{./fonts/}")
          cls = cls.replace(r"\def\kxtb@cjkfontpath{./}", r"\def\kxtb@cjkfontpath{./fonts/}")

          latin_start = cls.index(r"\newcommand{\kxtb@applylatinfonts}")
          cjk_start = cls.index(r"\newcommand{\kxtb@applycjkfonts}")
          math_start = cls.index(r"\newcommand{\kxtb@applymathfont}")
          latin = r'''\newcommand{\kxtb@applylatinfonts}{%
  \IfFileExists{\kxtb@latinfontpath\kxtb@latinfont@upright}{%
    \setmainfont[
      Path=\kxtb@latinfontpath,
      UprightFont=\kxtb@latinfont@upright,
      BoldFont=\kxtb@latinfont@bold,
      ItalicFont=\kxtb@latinfont@italic,
      BoldItalicFont=\kxtb@latinfont@bolditalic
    ]{\kxtb@latinfont@upright}%
    \setsansfont[
      Path=\kxtb@latinfontpath,
      UprightFont=\kxtb@latinfont@upright,
      BoldFont=\kxtb@latinfont@bold,
      ItalicFont=\kxtb@latinfont@italic,
      BoldItalicFont=\kxtb@latinfont@bolditalic
    ]{\kxtb@latinfont@upright}%
  }{%
    \ClassError{kxtbcas}{Required Times New Roman files are missing}{Run ./scripts/setup-fonts.sh before compiling this template.}%
  }%
}

'''
          cjk = r'''\newcommand{\kxtb@applycjkfonts}{%
  \IfFileExists{\kxtb@cjkfontpath\kxtb@cjkfont@upright}{%
    \setCJKmainfont[
      Path=\kxtb@cjkfontpath,
      UprightFont=\kxtb@cjkfont@upright,
      BoldFont=\kxtb@cjkfont@bold,
      ItalicFont=\kxtb@cjkfont@italic
    ]{\kxtb@cjkfont@upright}%
    \setCJKsansfont[
      Path=\kxtb@cjkfontpath,
      UprightFont=\kxtb@cjkfont@upright,
      BoldFont=\kxtb@cjkfont@bold,
      ItalicFont=\kxtb@cjkfont@italic
    ]{\kxtb@cjkfont@upright}%
  }{%
    \ClassError{kxtbcas}{Required SimSun files are missing}{Run ./scripts/setup-fonts.sh before compiling this template.}%
  }%
}

'''
          cls = cls[:latin_start] + latin + cjk + cls[math_start:]
          cls_path.write_text(cls, encoding="utf-8")

          fonts = new_dir / "fonts"
          fonts.mkdir(exist_ok=True)
          (fonts / ".gitignore").write_text("*.ttf\n*.ttc\n*.otf\n!.gitignore\n!README.md\n", encoding="utf-8")
          (fonts / "README.md").write_text(
              "# KXTB-CAS fonts\n\n"
              "This directory is private to this template. `scripts/setup-fonts.sh` copies the exact local Times New Roman and SimSun files used by the reference KXTB-CAS template into this directory.\n\n"
              "Required filenames: `TimesNewRoman-Regular.ttf`, `TimesNewRoman-Bold.ttf`, `TimesNewRoman-Italic.ttf`, `TimesNewRoman-BoldItalic.ttf`, `SimSun.ttf`, and `SimSun-Bold.ttf`.\n\n"
              "The font binaries are not redistributed by this public repository. Set `KXTBCAS_FONT_SOURCE_DIR` when the files are stored outside standard system font directories. The build fails instead of substituting another typeface when an exact required font is unavailable.\n",
              encoding="utf-8",
          )

          scripts = new_dir / "scripts"
          scripts.mkdir(exist_ok=True)
          setup = r'''#!/usr/bin/env bash
set -euo pipefail

ROOT="$(cd "$(dirname "$0")/.." && pwd)"
FONT_DIR="$ROOT/fonts"
mkdir -p "$FONT_DIR"

search_dirs=()
if [[ -n "${KXTBCAS_FONT_SOURCE_DIR:-}" ]]; then
  search_dirs+=("$KXTBCAS_FONT_SOURCE_DIR")
fi
search_dirs+=(
  "$HOME/Library/Fonts"
  "/Library/Fonts"
  "/System/Library/Fonts"
  "$HOME/.local/share/fonts"
  "/usr/local/share/fonts"
  "/usr/share/fonts"
  "/Applications/Microsoft Word.app/Contents/Resources/DFonts"
)

copy_required() {
  local target="$1"
  shift
  if [[ -s "$FONT_DIR/$target" ]]; then
    return
  fi
  local directory candidate found
  for directory in "${search_dirs[@]}"; do
    [[ -d "$directory" ]] || continue
    for candidate in "$@"; do
      found="$(find "$directory" -type f -iname "$candidate" -print -quit 2>/dev/null || true)"
      if [[ -n "$found" ]]; then
        cp "$found" "$FONT_DIR/$target"
        return
      fi
    done
  done
  echo "Missing required KXTB-CAS font: $target" >&2
  echo "Place the exact Times New Roman / SimSun files in $FONT_DIR or set KXTBCAS_FONT_SOURCE_DIR." >&2
  exit 1
}

copy_required "TimesNewRoman-Regular.ttf" "TimesNewRoman-Regular.ttf" "Times New Roman.ttf" "times.ttf"
copy_required "TimesNewRoman-Bold.ttf" "TimesNewRoman-Bold.ttf" "Times New Roman Bold.ttf" "timesbd.ttf"
copy_required "TimesNewRoman-Italic.ttf" "TimesNewRoman-Italic.ttf" "Times New Roman Italic.ttf" "timesi.ttf"
copy_required "TimesNewRoman-BoldItalic.ttf" "TimesNewRoman-BoldItalic.ttf" "Times New Roman Bold Italic.ttf" "timesbi.ttf"
copy_required "SimSun.ttf" "SimSun.ttf" "simsun.ttf"
copy_required "SimSun-Bold.ttf" "SimSun-Bold.ttf" "SimSun Bold.ttf" "simsunb.ttf"

printf 'KXTB-CAS fonts staged in %s\n' "$FONT_DIR"
'''
          (scripts / "setup-fonts.sh").write_text(setup, encoding="utf-8")
          (scripts / "build.sh").write_text(
              '#!/usr/bin/env bash\nset -euo pipefail\ncd "$(dirname "$0")/.."\n./scripts/setup-fonts.sh\nlatexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex\n',
              encoding="utf-8",
          )

          # Existing self-owned templates already own their font directories.
          # Make their local build entry point stage those local fonts automatically.
          for rel in (
              "thesis/classic-academic/scripts/build.sh",
              "report/classic-academic/scripts/build.sh",
          ):
              path = root / rel
              text = path.read_text(encoding="utf-8")
              if "./scripts/setup-fonts.sh" not in text:
                  text = text.replace('./scripts/validate.sh\n', './scripts/setup-fonts.sh\n./scripts/validate.sh\n', 1)
                  path.write_text(text, encoding="utf-8")

          # Remove the obsolete global synchronization dependency for this project-owned template.
          sync = root / "scripts" / "sync-journal-sources.sh"
          text = sync.read_text(encoding="utf-8")
          text = "\n".join(
              line for line in text.splitlines()
              if 'chinese/kxtbcas' not in line and 'journal/chinese' not in line
          ) + "\n"
          sync.write_text(text, encoding="utf-8")

          # Canonical naming: the template is KXTB-CAS, not a generic Chinese template.
          for path in [root / "README.md", *root.glob("journal/*/README.md")]:
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              text = text.replace("journal/chinese", "journal/kxtbcas")
              text = text.replace("Chinese Journal Template", "KXTB-CAS Template")
              text = text.replace("Chinese scientific manuscript, `kxtbcas`", "KXTB-CAS / 科学通报 manuscript")
              text = text.replace("Journal · Chinese", "Journal · KXTB-CAS")
              text = text.replace("Chinese journal article", "KXTB-CAS article")
              text = text.replace("Chinese `kxtbcas`", "KXTB-CAS `kxtbcas`")
              text = text.replace("`journal/chinese`", "`journal/kxtbcas`")
              path.write_text(text, encoding="utf-8")

          readme = new_dir / "README.md"
          text = readme.read_text(encoding="utf-8")
          text = text.replace(
              "The class keeps the original Times/SimSun serif roles and resolves portable fallbacks to TeX Gyre Termes and Song-style serif Chinese families. Both body and display-family roles are serif.",
              "The template uses the exact Times New Roman and SimSun font files defined by the reference KXTB-CAS class. Both roman and display-family roles resolve to those same serif files. Silent substitution is disabled."
          )
          text = text.replace(
              "The class requires XeLaTeX. Portable fallback fonts preserve the same serif typography without introducing a sans-serif Chinese display family.",
              "Run `./scripts/build.sh`. The local setup step copies the required Times New Roman and SimSun files into this template's own `fonts/` directory before XeLaTeX runs."
          )
          readme.write_text(text, encoding="utf-8")

          cache_script = root / "scripts" / "update-preview-revisions.py"
          if cache_script.is_file():
              text = cache_script.read_text(encoding="utf-8").replace("journal/chinese", "journal/kxtbcas")
              cache_script.write_text(text, encoding="utf-8")

          # Structural assertions: no generic folder and no fallback substitute in the class.
          if (root / "journal" / "chinese").exists():
              raise SystemExit("obsolete journal/chinese remains")
          check = cls_path.read_text(encoding="utf-8")
          for required in ("TimesNewRoman-Regular.ttf", "SimSun.ttf", "./fonts/"):
              if required not in check:
                  raise SystemExit(f"missing strict font contract: {required}")
          for forbidden in ("FandolSong", "TeX Gyre Termes", "Heiti SC", "STHeiti"):
              # declarations may remain above the strict loaders; remove them to prevent misleading fallback semantics.
              check = check.replace(f"\\def\\kxtb@cjkfallback@mainalt{{{forbidden}}}\n", "")
          cls_path.write_text(check, encoding="utf-8")
          PY

          chmod +x journal/kxtbcas/scripts/setup-fonts.sh journal/kxtbcas/scripts/build.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/migrate-kxtbcas.yml'
          git commit -m "refactor: isolate KXTB-CAS template fonts and naming"
          git push
