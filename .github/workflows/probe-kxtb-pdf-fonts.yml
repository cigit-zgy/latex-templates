name: Probe KXTB PDF fonts

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/probe-kxtb-pdf-fonts.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect reference PDF fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y poppler-utils
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/cigit-zgy/structure-object-perspective/3c2549120ebbc07104effdf8c7cbda390185c459/manuscript/initial_submission/output/manuscript.pdf \
            -o /tmp/kxtb.pdf
          pdffonts /tmp/kxtb.pdf
