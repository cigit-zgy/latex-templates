name: Vendor template fonts

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/vendor-template-fonts.yml"

permissions:
  contents: write

jobs:
  vendor-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            cabextract curl poppler-utils \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-lang-chinese texlive-bibtex-extra \
            texlive-science latexmk
          sudo mktexlsr

      - name: Vendor exact template fonts
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/core"
          curl --fail --location --retry 3 \
            https://downloads.sourceforge.net/corefonts/times32.exe \
            -o "$work/times32.exe"
          curl --fail --location --retry 3 \
            https://downloads.sourceforge.net/corefonts/arial32.exe \
            -o "$work/arial32.exe"
          cabextract -q -d "$work/core" "$work/times32.exe"
          cabextract -q -d "$work/core" "$work/arial32.exe"

          cd "$work/core"
          printf '%s  %s\n' \
            4e98adeff8ccc8ef4e3ece8d4547e288ff85fdc9c7ca711a4599c234874bbe86 times.ttf \
            4357b63cef20c01661a53c5dae70ffd20cb4765503aaed6d38b17a57c5a90bff timesbd.ttf \
            192e1b0d18e90334e999a99f8c32808d6a2e74b3698b8cd90c943c2249a46549 timesbi.ttf \
            c25ae529b4cecdbca148b6ccb862ee0abad770af8b1fd29c8dba619d1b8da78a timesi.ttf \
            35c0f3559d8db569e36c31095b8a60d441643d95f59139de40e23fada819b833 arial.ttf \
            4044aa6b5bebbc36980206b45b0aaaaa5681552a48bcadb41746d5d1d71fd7b4 arialbd.ttf \
            2f371cd9d96b3ac544519d85c16dc43ceacdfcea35090ee8ddf3ec5857c50328 arialbi.ttf \
            70ade233175a6a6675e4501461af9326e6f78b1ffdf787ca0da5ab0fc8c9cfd6 ariali.ttf \
            | sha256sum -c -
          cd "$GITHUB_WORKSPACE"

          nsfc_base="https://raw.githubusercontent.com/andy123t/nsfc-latex/11a02726f6190fcb89859dfaed18e3d1d68af0b8/fonts"
          for font in SimSun.ttf KaiTi.ttf FangSong.ttf; do
            curl --fail --location --retry 3 "$nsfc_base/$font" -o "$work/$font"
            test -s "$work/$font"
          done

          mkdir -p journal/kxtbcas/fonts nsfc-general/fonts nsfc-young/fonts
          rm -f journal/kxtbcas/fonts/*.ttf journal/kxtbcas/fonts/*.ttc journal/kxtbcas/fonts/*.otf
          rm -f nsfc-general/fonts/*.ttf nsfc-general/fonts/*.ttc nsfc-general/fonts/*.otf
          rm -f nsfc-young/fonts/*.ttf nsfc-young/fonts/*.ttc nsfc-young/fonts/*.otf

          cp "$work/core/times.ttf" journal/kxtbcas/fonts/times.ttf
          cp "$work/core/timesbd.ttf" journal/kxtbcas/fonts/timesbd.ttf
          cp "$work/core/timesi.ttf" journal/kxtbcas/fonts/timesi.ttf
          cp "$work/core/timesbi.ttf" journal/kxtbcas/fonts/timesbi.ttf
          cp "$work/SimSun.ttf" journal/kxtbcas/fonts/SimSun.ttf

          for template in nsfc-general nsfc-young; do
            cp "$work/core/arial.ttf" "$template/fonts/arial.ttf"
            cp "$work/core/arialbd.ttf" "$template/fonts/arialbd.ttf"
            cp "$work/core/ariali.ttf" "$template/fonts/ariali.ttf"
            cp "$work/core/arialbi.ttf" "$template/fonts/arialbi.ttf"
            cp "$work/SimSun.ttf" "$template/fonts/SimSun.ttf"
            cp "$work/KaiTi.ttf" "$template/fonts/KaiTi.ttf"
            cp "$work/FangSong.ttf" "$template/fonts/FangSong.ttf"
          done

      - name: Make font contracts repository-local
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kxtb = Path("journal/kxtbcas/kxtbcas.cls")
          text = kxtb.read_text(encoding="utf-8")
          replacements = {
              r"\def\kxtb@latinfont@upright{TimesNewRoman-Regular.ttf}": r"\def\kxtb@latinfont@upright{times.ttf}",
              r"\def\kxtb@latinfont@bold{TimesNewRoman-Bold.ttf}": r"\def\kxtb@latinfont@bold{timesbd.ttf}",
              r"\def\kxtb@latinfont@italic{TimesNewRoman-Italic.ttf}": r"\def\kxtb@latinfont@italic{timesi.ttf}",
              r"\def\kxtb@latinfont@bolditalic{TimesNewRoman-BoldItalic.ttf}": r"\def\kxtb@latinfont@bolditalic{timesbi.ttf}",
              r"\def\kxtb@cjkfont@bold{SimSun-Bold.ttf}": r"\def\kxtb@cjkfont@bold{SimSun.ttf}",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"KXTB expected text missing: {old}")
              text = text.replace(old, new, 1)
          text = text.replace(
              "      BoldFont=\\kxtb@cjkfont@bold,\n      ItalicFont=\\kxtb@cjkfont@italic\n",
              "      AutoFakeBold=3,\n      ItalicFont=\\kxtb@cjkfont@italic\n",
          )
          text = text.replace(
              "Run ./scripts/setup-fonts.sh before compiling this template.",
              "Restore the template-local fonts/ directory from the repository.",
          )
          if text.count("AutoFakeBold=3") != 2:
              raise SystemExit("KXTB CJK fake-bold contract was not applied twice")
          kxtb.write_text(text, encoding="utf-8")

          setup = Path("journal/kxtbcas/scripts/setup-fonts.sh")
          setup.write_text(
              """#!/usr/bin/env bash
set -euo pipefail
ROOT=\"$(cd \"$(dirname \"$0\")/..\" && pwd)\"
for font in times.ttf timesbd.ttf timesi.ttf timesbi.ttf SimSun.ttf; do
  if [[ ! -s \"$ROOT/fonts/$font\" ]]; then
    echo \"Missing bundled KXTB-CAS font: fonts/$font\" >&2
    exit 1
  fi
done
printf 'KXTB-CAS bundled fonts verified in %s\\n' \"$ROOT/fonts\"
""",
              encoding="utf-8",
          )

          for folder in ("nsfc-general", "nsfc-young"):
              cls = Path(folder) / "nsfc.cls"
              data = cls.read_text(encoding="utf-8")
              old = r"\setsansfont[Scale=0.98]{Arial}"
              new = """\\setsansfont[
  Path=fonts/,
  UprightFont=arial.ttf,
  BoldFont=arialbd.ttf,
  ItalicFont=ariali.ttf,
  BoldItalicFont=arialbi.ttf,
  Scale=0.98
]{arial.ttf}"""
              if old not in data:
                  raise SystemExit(f"Arial declaration missing in {cls}")
              data = data.replace(old, new, 1)
              cls.write_text(data, encoding="utf-8")

          Path("journal/kxtbcas/fonts/README.md").write_text(
              "# Bundled fonts\n\nThis template carries its own Times New Roman (`times*.ttf`) and SimSun (`SimSun.ttf`) files. No system-font lookup or cross-template font sharing is used. Chinese bold roles use the same SimSun face with XeCJK `AutoFakeBold=3`, preserving all common CJK glyphs while keeping the class-defined `\\bfseries` locations unchanged.\n",
              encoding="utf-8",
          )
          for folder in ("nsfc-general", "nsfc-young"):
              Path(folder, "fonts", "README.md").write_text(
                  "# Bundled fonts\n\nThis template carries its own Arial (`arial*.ttf`), SimSun (`SimSun.ttf`), KaiTi (`KaiTi.ttf`), and FangSong (`FangSong.ttf`) files. Compilation does not depend on fonts installed elsewhere on the machine or in another template directory.\n",
                  encoding="utf-8",
              )
          PY
          chmod +x journal/kxtbcas/scripts/setup-fonts.sh

      - name: Update documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("journal/kxtbcas/README.md")
          t = p.read_text(encoding="utf-8")
          start = t.index("## Typography and layout")
          end = t.index("## Build", start)
          section = """## Typography and layout

The template is self-contained. Its own `fonts/` directory contains Times New Roman (`times.ttf`, `timesbd.ttf`, `timesi.ttf`, `timesbi.ttf`) and SimSun (`SimSun.ttf`). Both Latin roman/display roles resolve to Times New Roman; both Chinese roman/display roles resolve to SimSun, so the class's `\\sffamily` title and heading roles remain visually serif. `\\bfseries`, title centering, heading sizes, spacing, geometry, captions, and front matter remain class-defined. Chinese bold uses SimSun with XeCJK `AutoFakeBold=3`; it does not substitute SimSun-ExtB.

No system-font lookup, shared font directory, or font download is required after cloning the repository.

"""
          t = t[:start] + section + t[end:]
          t = t.replace("./scripts/build.sh\n```", "./scripts/build.sh\n```\n\nDirect `xelatex`/`latexmk` compilation also uses only the bundled `fonts/` directory.")
          preview_start = t.index("## Preview")
          source_start = t.index("## Source", preview_start)
          preview = """## Preview

The preview is generated from this directory's own `main.tex` using the bundled Times New Roman + SimSun files, then rasterized from the resulting PDF at 100 DPI.

![KXTB-CAS first page](preview/article.png)

![KXTB-CAS content page](preview/content.png)

"""
          t = t[:preview_start] + preview + t[source_start:]
          p.write_text(t, encoding="utf-8")

          for folder, title in (("nsfc-general", "面上项目"), ("nsfc-young", "青年科学基金项目（C类）")):
              p = Path(folder, "README.md")
              t = p.read_text(encoding="utf-8")
              old = "编译前需将合法取得的以下字体文件分别放入本模板自己的 `fonts/`：\n\n```text\nSimSun.ttf\nKaiTi.ttf\nFangSong.ttf\n```\n\n字体文件不在本仓库中二次分发。"
              new = "本模板自己的 `fonts/` 已包含 Arial、SimSun、KaiTi 和 FangSong 所需字形文件；每个 NSFC 模板保存独立的一套，不引用仓库其他模板或操作系统字体。克隆仓库后可直接编译。"
              if old in t:
                  t = t.replace(old, new, 1)
              marker = "## 预览\n\n"
              i = t.index(marker) + len(marker)
              j = t.index("\n## 来源", i)
              preview = f"预览由本仓库 `{folder}/main.tex` 使用该目录自己的 `fonts/` 实际编译 PDF 后生成；首页与正文页均由该 PDF 以 100 DPI 直接转换。\n\n![2026 {title}首页](preview/application.png)\n\n![2026 {title}正文页](preview/content.png)\n"
              t = t[:i] + preview + t[j:]
              p.write_text(t, encoding="utf-8")

          root = Path("README.md")
          t = root.read_text(encoding="utf-8")
          t = t.replace(
              "All committed preview PNGs are 100-dpi renders of compiled PDFs. Templates that require proprietary local fonts use a pinned, already compiled reference PDF for preview generation, so the preview does not silently switch to substitute fonts in CI.",
              "All committed preview PNGs are 100-dpi renders of PDFs compiled from the template source in this repository. Templates with Times New Roman, Arial, SimSun, KaiTi, or FangSong keep their required files inside their own template-local `fonts/` directories, so preview builds do not depend on system fonts or another repository.",
          )
          t = t.replace(
              "- Proprietary-font previews are rendered from pinned reference PDFs, not from substitute-font CI builds.\n",
              "- KXTB-CAS and both NSFC previews are compiled from this repository using template-local bundled fonts.\n",
          )
          root.write_text(t, encoding="utf-8")
          PY

      - name: Compile and render KXTB-CAS
        run: |
          cd journal/kxtbcas
          ./scripts/build.sh
          if grep -q "Missing character:" main.log; then
            echo "KXTB-CAS build contains missing glyphs" >&2
            grep "Missing character:" main.log | head -n 20 >&2
            exit 1
          fi
          pdffonts main.pdf | tee /tmp/kxtb-fonts.txt
          grep -Eiq 'TimesNewRoman|Times New Roman' /tmp/kxtb-fonts.txt
          grep -Eiq 'SimSun' /tmp/kxtb-fonts.txt
          ! grep -Eiq 'FandolHei|FandolSong|TeXGyreTermes|TeX Gyre Termes' /tmp/kxtb-fonts.txt
          mkdir -p preview
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/article
          pdftoppm -f 2 -singlefile -png -r 100 main.pdf preview/content

      - name: Compile and render NSFC General
        run: |
          cd nsfc-general
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          if grep -q "Missing character:" main.log; then
            echo "NSFC General build contains missing glyphs" >&2
            grep "Missing character:" main.log | head -n 20 >&2
            exit 1
          fi
          pdffonts main.pdf | tee /tmp/nsfc-general-fonts.txt
          grep -Eiq 'Arial' /tmp/nsfc-general-fonts.txt
          grep -Eiq 'SimSun' /tmp/nsfc-general-fonts.txt
          mkdir -p preview
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/application
          pdftoppm -f 2 -singlefile -png -r 100 main.pdf preview/content

      - name: Compile and render NSFC Young
        run: |
          cd nsfc-young
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          if grep -q "Missing character:" main.log; then
            echo "NSFC Young build contains missing glyphs" >&2
            grep "Missing character:" main.log | head -n 20 >&2
            exit 1
          fi
          pdffonts main.pdf | tee /tmp/nsfc-young-fonts.txt
          grep -Eiq 'Arial' /tmp/nsfc-young-fonts.txt
          grep -Eiq 'SimSun' /tmp/nsfc-young-fonts.txt
          mkdir -p preview
          rm -f preview/*.png
          pdftoppm -f 1 -singlefile -png -r 100 main.pdf preview/application
          pdftoppm -f 2 -singlefile -png -r 100 main.pdf preview/content

      - name: Verify preview dimensions
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          paths = [
              Path("journal/kxtbcas/preview/article.png"),
              Path("journal/kxtbcas/preview/content.png"),
              Path("nsfc-general/preview/application.png"),
              Path("nsfc-general/preview/content.png"),
              Path("nsfc-young/preview/application.png"),
              Path("nsfc-young/preview/content.png"),
          ]
          for path in paths:
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"not PNG: {path}")
              w, h = struct.unpack(">II", data[16:24])
              if (w, h) not in {(827, 1169), (827, 1170)}:
                  raise SystemExit(f"unexpected 100-DPI A4 size {w}x{h}: {path}")
              print(path, w, h)
          PY

      - name: Commit bundled fonts and previews
        run: |
          rm .github/workflows/vendor-template-fonts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bundle template-local fonts and render source previews"
          git push origin master
